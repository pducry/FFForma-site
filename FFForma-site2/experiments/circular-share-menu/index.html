<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Share Menu — FFForma Experiments</title>
  <meta name="description" content="FFForma Experiment 001 — radial share actions on a dotted orbit.">
  <meta name="theme-color" content="#0b0a09">
  <link rel="icon" type="image/png" href="../../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0a09;
      --fg: #e8e6e2;
      --subtle: #a3a09b;
      --subtler: #6f6c67;
      --line: #262421;
      --accent: #c8ff00;
      --font-mono: 'Geist Mono', 'Courier New', monospace;
      --font-serif: 'Instrument Serif', Georgia, serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.7;
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg);
    }

    a {
      color: var(--subtle);
      text-decoration: underline dotted;
      text-decoration-color: var(--subtler);
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    a:hover { color: var(--accent); }

    a:focus-visible,
    button:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 3px;
    }

    .container {
      width: 90%;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    header { padding: 56px 0 0; }

    .exp-eyebrow {
      font-size: 0.72rem;
      color: var(--subtler);
      margin: 40px 0 6px;
    }

    h1 {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .exp-sub {
      color: var(--subtle);
      margin-top: 6px;
    }

    /* ─── Stage ─── */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 420px;
    }

    .share-menu {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Dotted orbit ring */
    .orbit {
      position: absolute;
      width: 208px;
      height: 208px;
      border: 1px dotted var(--subtler);
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.55);
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .share-menu.is-open .orbit {
      opacity: 0.55;
      transform: scale(1);
      animation: orbitSpin 60s linear infinite;
    }

    @keyframes orbitSpin {
      from { transform: scale(1) rotate(0deg); }
      to { transform: scale(1) rotate(360deg); }
    }

    /* Center trigger */
    .share-trigger {
      position: relative;
      z-index: 2;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .share-trigger:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .share-trigger svg {
      width: 20px;
      height: 20px;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .share-menu.is-open .share-trigger svg {
      transform: rotate(135deg);
    }

    /* Orbiting items */
    .share-item {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--subtle);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translate(0, 0) scale(0.4);
      pointer-events: none;
      transition:
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.3s ease,
        border-color 0.2s ease,
        color 0.2s ease;
    }

    .share-item svg {
      width: 17px;
      height: 17px;
    }

    .share-menu.is-open .share-item {
      opacity: 1;
      pointer-events: auto;
      transform: translate(var(--x), var(--y)) scale(1);
    }

    .share-item:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Staggered bloom */
    .share-menu.is-open .share-item:nth-child(1) { transition-delay: 0.02s; }
    .share-menu.is-open .share-item:nth-child(2) { transition-delay: 0.06s; }
    .share-menu.is-open .share-item:nth-child(3) { transition-delay: 0.10s; }
    .share-menu.is-open .share-item:nth-child(4) { transition-delay: 0.14s; }
    .share-menu.is-open .share-item:nth-child(5) { transition-delay: 0.18s; }
    .share-menu.is-open .share-item:nth-child(6) { transition-delay: 0.22s; }

    /* Hint & toast */
    .stage-footer {
      text-align: center;
      padding-bottom: 64px;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--subtler);
    }

    .toast {
      font-size: 0.75rem;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.25s ease;
      min-height: 1.5em;
    }

    .toast.is-visible { opacity: 1; }

    footer {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1rem;
      color: var(--subtler);
      text-align: center;
      padding: 0 0 32px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <a href="../../">&larr; FFForma</a>
    <p class="exp-eyebrow">FFForma Experiments · UI · 001</p>
    <h1>Circular Share Menu</h1>
    <p class="exp-sub">Radial share actions on a dotted orbit.</p>
  </header>

  <div class="stage">
    <div class="share-menu" id="shareMenu">
      <div class="orbit" aria-hidden="true"></div>

      <!-- Orbiting actions -->
      <button class="share-item" data-action="copy" aria-label="Copy link" title="Copy link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
      <button class="share-item" data-action="x" aria-label="Share on X" title="Share on X">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14"/><path d="M19 5L5 19"/></svg>
      </button>
      <button class="share-item" data-action="whatsapp" aria-label="Share on WhatsApp" title="Share on WhatsApp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </button>
      <button class="share-item" data-action="telegram" aria-label="Share on Telegram" title="Share on Telegram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
      <button class="share-item" data-action="email" aria-label="Share by email" title="Share by email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
      </button>
      <button class="share-item" data-action="native" aria-label="More options" title="More options">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.83 3.98"/></svg>
      </button>

      <!-- Center trigger -->
      <button class="share-trigger" id="shareTrigger" aria-expanded="false" aria-label="Share this page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
    </div>
  </div>

  <div class="stage-footer">
    <p class="toast" id="toast"></p>
    <p class="hint">Click the center. Share this page.</p>
  </div>

  <footer>Form Follows Function.</footer>
</div>

<script>
  const menu = document.getElementById('shareMenu');
  const trigger = document.getElementById('shareTrigger');
  const toast = document.getElementById('toast');
  const items = document.querySelectorAll('.share-item');

  // Place items on the orbit: 6 slots, starting at 12 o'clock
  const RADIUS = 104;
  items.forEach((item, i) => {
    const angle = (-90 + i * 60) * Math.PI / 180;
    item.style.setProperty('--x', (Math.cos(angle) * RADIUS).toFixed(1) + 'px');
    item.style.setProperty('--y', (Math.sin(angle) * RADIUS).toFixed(1) + 'px');
  });

  function setOpen(open) {
    menu.classList.toggle('is-open', open);
    trigger.setAttribute('aria-expanded', String(open));
  }

  trigger.addEventListener('click', () => {
    setOpen(!menu.classList.contains('is-open'));
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') setOpen(false);
  });

  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target)) setOpen(false);
  });

  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2000);
  }

  const pageUrl = () => encodeURIComponent(location.href);
  const pageTitle = () => encodeURIComponent(document.title);

  const actions = {
    copy() {
      navigator.clipboard.writeText(location.href)
        .then(() => showToast('Link copied'))
        .catch(() => showToast('Copy failed'));
    },
    x() {
      window.open('https://twitter.com/intent/tweet?url=' + pageUrl() + '&text=' + pageTitle(), '_blank', 'noopener');
    },
    whatsapp() {
      window.open('https://wa.me/?text=' + pageTitle() + '%20' + pageUrl(), '_blank', 'noopener');
    },
    telegram() {
      window.open('https://t.me/share/url?url=' + pageUrl() + '&text=' + pageTitle(), '_blank', 'noopener');
    },
    email() {
      location.href = 'mailto:?subject=' + pageTitle() + '&body=' + pageUrl();
    },
    native() {
      if (navigator.share) {
        navigator.share({ title: document.title, url: location.href }).catch(() => {});
      } else {
        actions.copy();
      }
    }
  };

  items.forEach(item => {
    item.addEventListener('click', () => {
      const fn = actions[item.dataset.action];
      if (fn) fn();
    });
  });
</script>

</body>
</html>
